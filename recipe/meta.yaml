{% set name = "azure-search-documents" %}
{% set version = "12.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 8e6d73ec0ed1623083435b757e34324db65d72d4e09cca061a59fc7e90c8ddbc

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - setuptools >=77.0.3
  run:
    - python
    - azure-core >=1.37.0
    - isodate >=0.6.1
    - typing-extensions >=4.6.0

test:
  imports:
    - azure.search.documents
    - azure.search.documents.indexes
    - azure.search.documents.aio
    - azure.search.documents.indexes.aio
  commands:
    - pip check
    - python -c "from azure.search.documents import SearchClient, SearchIndexingBufferedSender; from azure.search.documents.indexes import SearchIndexClient, SearchIndexerClient"
  requires:
    - pip

about:
  home: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/search/azure-search-documents
  dev_url: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/search/azure-search-documents
  doc_url: https://learn.microsoft.com/en-us/python/api/overview/azure/search-documents-readme
  summary: Microsoft Azure Cognitive Search Client Library for Python
  description: |
    Azure Search Documents client library for Python provides APIs to create and
    manage search indexes, load and query documents, and manage indexers and
    data sources in Azure AI Search.
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
